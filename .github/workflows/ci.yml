name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      - name: Unit tests and guardrails
        working-directory: ml/tests
        run: python -m unittest discover -s . -t . -v

  notebooks:
    name: Notebooks still execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      # Executed to a throwaway copy: the committed notebooks keep the outputs
      # their author reviewed. This job only answers "does it still run",
      # which is how results quietly rot without anyone noticing.
      - name: Execute every notebook
        working-directory: ml
        run: |
          mkdir -p /tmp/nb-ci
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=1800 \
              --output-dir=/tmp/nb-ci "$nb"
            echo "::endgroup::"
          done
