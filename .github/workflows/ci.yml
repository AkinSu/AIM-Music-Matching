name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      - name: Unit tests and guardrails
        working-directory: ml/tests
        run: python -m unittest discover -s . -t . -v

  notebooks:
    name: Notebooks still execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      # Re-executes the notebooks that can run without data/raw (they fall
      # back to synthetic data), and structurally validates the ones that
      # cannot. See scripts/ci_notebooks.py for why the split exists.
      - name: Check notebooks
        working-directory: ml
        run: python scripts/ci_notebooks.py
