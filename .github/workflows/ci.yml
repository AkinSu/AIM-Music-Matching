name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      - name: Unit tests and guardrails
        working-directory: ml/tests
        run: python -m unittest discover -s . -t . -v

  notebooks:
    name: Notebooks still execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install
        run: pip install -r ml/requirements.txt

      # Re-executes the notebooks that can run without data/raw (they fall
      # back to synthetic data), and structurally validates the ones that
      # cannot. See scripts/ci_notebooks.py for why the split exists.
      - name: Check notebooks
        working-directory: ml
        run: python scripts/ci_notebooks.py

  app-tests:
    name: App tests
    runs-on: ubuntu-latest
    # The 46 tests in "LOVIFY ME APP/tests" were never run by CI. Only the ml
    # suite was, so every change to the match flow, the OAuth state signing
    # and the share link merged unverified -- including the one that made the
    # share link a seat-takeover oracle, which a human found by reading.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lovify
          POSTGRES_PASSWORD: lovify
          POSTGRES_DB: lovify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lovify -d lovify"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      # The suite's own conftest builds the schema; it needs a key because
      # lovify.py refuses to import without one, by design.
      - name: App tests
        working-directory: "LOVIFY ME APP"
        env:
          SECRET_KEY: ci-only-not-a-real-key
          DATABASE_URL: postgresql+psycopg://lovify:lovify@localhost:5432/lovify
          PYTHONPATH: ${{ github.workspace }}/ml/src
        run: python -m pytest -q tests
